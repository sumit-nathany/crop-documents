# ── Crop / border settings ────────────────────────────────────────────────────
# How far to expand the detected document edges outward, as a percentage
# of the quad size. This gives a natural sliver of background around the doc.
# Increase this if you want more context visible. Range: 0–15 (recommended: 2–6)
expansion_pct: 4.0

# ── Boundary snapping ─────────────────────────────────────────────────────────
# If a detected corner is more than this many percent of the image dimension
# away from the nearest image edge, snap it toward that edge. This fixes cases
# where a folded/curled page misleads the Vision detector into missing the true
# document boundary (e.g. top of document gets clipped).
# Set to 0 to disable. Range: 0–20 (recommended: 6–10)
boundary_snap_pct: 8.0

# ── Output settings ───────────────────────────────────────────────────────────
# Default output directory when --output is not specified on the CLI
output_dir: "./output"

# ── JPEG quality ─────────────────────────────────────────────────────────────
# Only applies to JPEG output. 95 is near-lossless. Range: 60–100.
jpeg_quality: 95

# ── Supported input formats ───────────────────────────────────────────────────
# These are detected by file extension. HEIC is supported via Pillow on macOS.
supported_extensions:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .tif
  - .heic
  - .heif

# ── Auto-rotation settings ────────────────────────────────────────────────────
# Use Tesseract OSD to auto-detect and correct document orientation after cropping.
# Opt-in: set to true to enable, or pass --rotate on the CLI.
# Requires: brew install tesseract  &&  pip install pytesseract
auto_rotate: false
# Minimum OSD orientation confidence to apply rotation (higher = more conservative).
# Range: 0.0 – ∞  |  Recommended: 1.0
rotate_confidence: 1.0
