# ── Crop / border settings ────────────────────────────────────────────────────
# How far to expand the detected document edges outward, as a percentage
# of the quad size. This gives a natural sliver of background around the doc.
# Increase this if you want more context visible. Range: 0–15 (recommended: 2–6)
expansion_pct: 4.0

# When `--deskew` is on, the pipeline adds +4 to expansion_pct for the initial
# warp and final organic margin (default 4 → 8) so flap trim doesn't snug to ink.

# ── Output settings ───────────────────────────────────────────────────────────
# Default output directory when --output is not specified on the CLI
output_dir: "./output"

# ── JPEG quality ─────────────────────────────────────────────────────────────
# Only applies to JPEG output. 95 is near-lossless. Range: 60–100.
jpeg_quality: 95

# ── Supported input formats ───────────────────────────────────────────────────
# These are detected by file extension. HEIC is supported via Pillow on macOS.
supported_extensions:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .tif
  - .heic
  - .heif

# ── Alignment (`--deskew`) ────────────────────────────────────────────────────
# Conservative align stack: keystone refine, wider border (+4), micro-rotation,
# top/bottom flap trim only. Vision re-square / color-flap trim are OFF by
# default (they routinely destroy good crops). Opt-in; recommended for handheld.
deskew: false

# ── Auto-rotation (`--rotate`) ────────────────────────────────────────────────
# Fix 90°/180°/270° orientation via Tesseract OSD after crop/align.
# Requires: brew install tesseract  &&  pip install pytesseract
auto_rotate: false
# Minimum OSD orientation confidence to apply rotation (higher = more conservative).
# Range: 0.0 – ∞  |  Recommended: 1.0
rotate_confidence: 1.0

# ── Auto-enhancement (`--enhance`) ────────────────────────────────────────────
# Apply Apple Photos native CoreImage auto-enhancement
# (exposure, contrast, tone curves, color balance).
auto_enhance: false

